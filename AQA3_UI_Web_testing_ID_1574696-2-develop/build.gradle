plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

allure {
    version = '2.29.0'
    useJUnit5 {
        version = '2.29.0'
    }
}

dependencies {
    implementation 'com.codeborne:selenide:7.5.1'
    implementation 'org.seleniumhq.selenium:selenium-java:4.25.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.18.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.1'
    testImplementation 'org.junit.platform:junit-platform-suite:1.11.0'

    // Allure
    testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.29.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.29.0'
    testImplementation 'io.qameta.allure:allure-junit5:2.29.0'
}

test {
    useJUnitPlatform()

    systemProperty 'browser',     project.findProperty('browser')     ?: 'chrome'
    systemProperty 'browserSize', project.findProperty('browserSize') ?: '1600x900'
    systemProperty 'headless',    project.findProperty('headless')    ?: 'false'
    systemProperty 'timeout',     project.findProperty('timeout')     ?: '4000'

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
